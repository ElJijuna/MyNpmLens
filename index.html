    <title>Npm Lens</title>
    <script>
      // Decode the path redirect from 404.html and restore it before the router mounts.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p) {
          var q = params.get('q');
          var hash = window.location.hash;
          var newUrl =
            window.location.pathname +
            decodeURIComponent(p) +
            (q ? '?' + decodeURIComponent(q) : '') +
            hash;
          window.history.replaceState(null, '', newUrl);
        }
      })();
    </script>

    <div id="root"></div>
    <install installurl="https://npm-lens.app" manifestid="https://npm-lens.app/"></install>
    <script type="module" src="/src/main.tsx"></script>
  </body>
